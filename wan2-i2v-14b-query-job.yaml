# Instruction-level NTFF query pod. Mounts the PVC only to copy the results
# tarball to LOCAL /tmp; all neuron-explorer ingest/SQL runs on /tmp (never on
# the S3-backed /var/mdl). Pod stays alive (sleep) so you kubectl exec in and
# run scripts/neuron/query_ntff.sh — the explorer view server can hang on big
# DMA NEFFs, so we drive it interactively and query one NEFF at a time.
#
# Launch:  kubectl delete job wan2-i2v-14b-query 2>/dev/null; kubectl apply -f wan2-i2v-14b-query-job.yaml
# Enter:   kubectl exec -it job/wan2-i2v-14b-query -- bash
#          cd /tmp/wan2-i2v-14b && bash scripts/neuron/query_ntff.sh
apiVersion: batch/v1
kind: Job
metadata:
  name: wan2-i2v-14b-query
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: wan2-i2v-14b-query
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn2
      resourceClaims:
        - name: s-lnc1-trn2
          resourceClaimTemplateName: s-lnc1-trn2
      containers:
        - name: query
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-ec"
            - |
              set -euo pipefail
              cd /tmp
              git clone -b main https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/wan2-i2v-14b.git wan2-i2v-14b
              echo "Query pod ready. Exec in and run:"
              echo "  cd /tmp/wan2-i2v-14b && bash scripts/neuron/query_ntff.sh"
              echo "Sleeping 6h so you can exec in (kubectl delete job to end)."
              sleep 21600
          resources:
            claims:
              - name: s-lnc1-trn2
            requests:
              cpu: 22
              memory: 220Gi
            limits:
              cpu: 22
              memory: 220Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
