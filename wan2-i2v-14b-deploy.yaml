apiVersion: v1
kind: Service
metadata:
  name: wan2-i2v-14b
  namespace: default
spec:
  selector:
    app: wan2-i2v-14b-serve
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wan2-i2v-14b-serve
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wan2-i2v-14b-serve
  template:
    metadata:
      labels:
        app: wan2-i2v-14b-serve
    spec:
      nodeSelector:
        node-type: trn2
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: m-lnc2
      containers:
        - name: inference
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: Always
          command:
            - /bin/bash
            - "-ec"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b "$BRANCH" https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/wan2-i2v-14b.git wan2-i2v-14b
              cd wan2-i2v-14b
              echo "PROVENANCE: $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse HEAD) - $(git log -1 --pretty=%s)"

              export NEURON_COMPILE_CACHE_URL=/var/tmp/neuron-compile-cache
              export TORCH_NEURONX_NEFF_CACHE_DIR=/tmp/neff_cache
              export WAN_DIR=/tmp/wan2-i2v-14b
              export MODEL_PATH=/tmp/Wan2.2-I2V-A14B

              bash scripts/prepare.sh 2>&1 | tail -5 || { echo "PREPARE FAILED"; exit 1; }
              uv pip install --python "$(command -v python3)" fastapi uvicorn

              # NEFF cache: restore from the PVC (tar.gz only), save it once after the first warmup.
              ARCHIVE_DIR=/var/mdl/wan2_2_i2v; mkdir -p "$ARCHIVE_DIR" || true
              CACHE_TAR="$ARCHIVE_DIR/neff_cache_serve_${OUT_H}x${OUT_W}_${FRAME_NUM}f.tar.gz"
              if [ -f "$CACHE_TAR" ]; then
                cp "$CACHE_TAR" /tmp/neff_cache.tar.gz && tar -xzf /tmp/neff_cache.tar.gz -C / \
                  && echo "NEFF cache restored from $CACHE_TAR" || echo "NEFF cache restore failed"
                rm -f /tmp/neff_cache.tar.gz
              fi

              torchrun --nproc_per_node="$NPROC" --master_port=29500 serve.py 2>&1 | tee /tmp/serve.log &
              SERVER=$!

              until python3 -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readiness', timeout=5)" 2>/dev/null; do
                kill -0 $SERVER 2>/dev/null || { echo "SERVER EXITED"; exit 1; }
                sleep 30
              done
              echo "████ ENDPOINT READY: http://wan2-i2v-14b.default.svc.cluster.local:8000 ████"
              if [ ! -f "$CACHE_TAR" ]; then
                tar -czf /tmp/neff_cache.tar.gz /var/tmp/neuron-compile-cache /tmp/neff_cache 2>/dev/null \
                  && cp /tmp/neff_cache.tar.gz "$CACHE_TAR" && echo "NEFF cache saved to $CACHE_TAR" \
                  || echo "NEFF cache save skipped"
                rm -f /tmp/neff_cache.tar.gz
              fi
              wait $SERVER || true
              echo "SERVER EXITED"; exit 1
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 7200
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 10
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 22
              memory: 220Gi
            limits:
              cpu: 22
              memory: 220Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: TORCH_NEURONX_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_FLAGS
              value: "--model-type=transformer"
            - name: BRANCH
              value: "serve"
            - name: NPROC
              value: "8"
            - name: ATTN_IMPL
              value: "fast"
            - name: FAST_ATTN_IMPL
              value: "cte"
            - name: FAST_OPROJ
              value: "1"
            - name: FAST_ADALN
              value: "1"
            - name: FAST_MLP
              value: "0"
            - name: USE_NKI_KERNELS
              value: "1"
            - name: NEURON_RT_DBG_INTRA_RDH_CHANNEL_BUFFER_SIZE
              value: "134217728"
            - name: OUT_H
              value: "368"
            - name: OUT_W
              value: "480"
            - name: NUM_STEPS
              value: "10"
            - name: FRAME_NUM
              value: "21"
            - name: CUDA_VISIBLE_DEVICES
              value: ""
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
