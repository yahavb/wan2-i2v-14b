apiVersion: v1
kind: Service
metadata:
  name: wan2-i2v-14b
  namespace: default
spec:
  selector:
    app: wan2-i2v-14b-serve
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wan2-i2v-14b-serve
  namespace: default
spec:
  replicas: 8
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wan2-i2v-14b-serve
  template:
    metadata:
      labels:
        app: wan2-i2v-14b-serve
    spec:
      nodeSelector:
        node-type: trn2
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: m-lnc2
      containers:
        - name: inference
          image: public.ecr.aws/neuron/torch-neuronx:2.14.0-neuronx-py314-sdk2.33.0-ubuntu26.04
          imagePullPolicy: Always
          command:
            - /bin/bash
            - "-ec"
            - |
              set -euo pipefail

              cd /tmp
              git clone -b "$BRANCH" https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/wan2-i2v-14b.git wan2-i2v-14b
              cd wan2-i2v-14b
              echo "PROVENANCE: $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse HEAD) - $(git log -1 --pretty=%s)"

              export NEURON_COMPILE_CACHE_URL=/var/tmp/neuron-compile-cache
              export TORCH_NEURONX_NEFF_CACHE_DIR=/tmp/neff_cache
              export WAN_DIR=/tmp/wan2-i2v-14b
              export MODEL_PATH=/tmp/Wan2.2-I2V-A14B

              # Node cache (hostPath, shared by every pod of this model on the node): the model
              # weights and the compiled NEFFs survive container restarts, so recovery skips the
              # 118 GB download and the compile. One pod at a time writes (flock); a ".complete"
              # marker / atomic mv means a half-written entry is never used.
              NODE_CACHE=/node-cache; mkdir -p "$NODE_CACHE"
              uv pip install --python "$(command -v python3)" huggingface_hub
              ln -sfn "$NODE_CACHE/Wan2.2-I2V-A14B" "$MODEL_PATH"
              flock "$NODE_CACHE/model.lock" bash -c '
                [ -f "$1/Wan2.2-I2V-A14B/.complete" ] && { echo "model: on node cache"; exit 0; }
                echo "model: downloading to node cache (resumes a partial download)"
                python3 -c "from huggingface_hub import snapshot_download as d; d(\"Wan-AI/Wan2.2-I2V-A14B\", local_dir=\"$1/Wan2.2-I2V-A14B\")"
                touch "$1/Wan2.2-I2V-A14B/.complete"' _ "$NODE_CACHE"

              bash scripts/prepare.sh 2>&1 | tail -5 || { echo "PREPARE FAILED"; exit 1; }
              uv pip install --python "$(command -v python3)" fastapi uvicorn

              # NEFF cache: node cache first, then the PVC (tar.gz only); saved to both after warmup.
              # Keyed by compiler version and model code: a key that only misses would never be replaced.
              ARCHIVE_DIR=/var/mdl/wan2_2_i2v; mkdir -p "$ARCHIVE_DIR" || true
              CC_VER=$(python3 -c "import neuronxcc; print(neuronxcc.__version__)" 2>/dev/null || echo unknown)
              CODE_VER=$(git log -1 --format=%h -- serve.py models wan kernels)
              CACHE_NAME="neff_cache_serve_${OUT_H}x${OUT_W}_${FRAME_NUM}f_cc${CC_VER}_${CODE_VER}.tar.gz"
              NODE_TAR="$NODE_CACHE/$CACHE_NAME"; CACHE_TAR="$ARCHIVE_DIR/$CACHE_NAME"
              for SRC in "$NODE_TAR" "$CACHE_TAR"; do
                [ -f "$SRC" ] || continue
                if tar -xzf "$SRC" -C /; then echo "NEFF cache restored from $SRC"; break; fi
                echo "NEFF cache restore from $SRC failed"
              done

              torchrun --nproc_per_node="$NPROC" --master_port=29500 serve.py 2>&1 | tee /tmp/serve.log &
              SERVER=$!

              until python3 -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readiness', timeout=5)" 2>/dev/null; do
                kill -0 $SERVER 2>/dev/null || { echo "SERVER EXITED"; exit 1; }
                sleep 30
              done
              echo "████ ENDPOINT READY: http://wan2-i2v-14b.default.svc.cluster.local:8000 ████"
              if [ ! -f "$NODE_TAR" ] || [ ! -f "$CACHE_TAR" ]; then
                DIRS=$(for d in /var/tmp/neuron-compile-cache /tmp/neff_cache; do [ -d "$d" ] && echo "$d"; done; true)
                if tar -czf /tmp/neff_cache.tar.gz $DIRS; then
                  flock "$NODE_CACHE/neff.lock" bash -c '[ -f "$2" ] || { cp "$1" "$2.tmp.$$" && mv "$2.tmp.$$" "$2"; }' \
                    _ /tmp/neff_cache.tar.gz "$NODE_TAR" && echo "NEFF cache on node: $NODE_TAR"
                  [ -f "$CACHE_TAR" ] || { cp /tmp/neff_cache.tar.gz "$CACHE_TAR" && echo "NEFF cache saved to $CACHE_TAR"; } \
                    || echo "NEFF cache PVC save skipped"
                fi
                rm -f /tmp/neff_cache.tar.gz
              fi
              wait $SERVER || true
              echo "SERVER EXITED"; exit 1
          ports:
            - containerPort: 8000
          # The HTTP server starts only after download + compile + warmup. Allow up to
          # 4 h (30 s x 480); liveness and readiness start only after this succeeds.
          startupProbe:
            httpGet:
              path: /readiness
              port: 8000
            periodSeconds: 30
            failureThreshold: 480
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 22
              memory: 220Gi
            limits:
              cpu: 22
              memory: 220Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
            - name: node-cache
              mountPath: /node-cache
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: TORCH_NEURONX_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_FLAGS
              value: "--model-type=transformer"
            - name: BRANCH
              value: "main"
            # Device heartbeat (see serve.py docstring) and /debug/fail for testing it.
            - name: HEARTBEAT_S
              value: "60"
            - name: HEALTH_GRACE_S
              value: "60"
            - name: MAX_REQUEST_S
              value: "900"
            - name: FAULT_INJECTION
              value: "1"
            - name: NPROC
              value: "8"
            - name: ATTN_IMPL
              value: "fast"
            - name: FAST_ATTN_IMPL
              value: "cte"
            - name: FAST_OPROJ
              value: "1"
            - name: FAST_ADALN
              value: "1"
            - name: FAST_MLP
              value: "0"
            - name: USE_NKI_KERNELS
              value: "1"
            - name: NEURON_RT_DBG_INTRA_RDH_CHANNEL_BUFFER_SIZE
              value: "134217728"
            - name: OUT_H
              value: "368"
            - name: OUT_W
              value: "480"
            - name: NUM_STEPS
              value: "10"
            - name: FRAME_NUM
              value: "21"
            - name: CUDA_VISIBLE_DEVICES
              value: ""
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
        # Model weights + compiled NEFFs, kept on the node across restarts (see the script).
        - name: node-cache
          hostPath:
            path: /opt/wan2-i2v-14b
            type: DirectoryOrCreate
