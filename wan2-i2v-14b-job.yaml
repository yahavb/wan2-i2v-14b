apiVersion: batch/v1
kind: Job
metadata:
  name: wan2-i2v-14b
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: wan2-i2v-14b
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn2
      resourceClaims:
        - name: s-lnc1-trn2
          resourceClaimTemplateName: s-lnc1-trn2
      containers:
        - name: inference
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-ec"
            - |
              set -euo pipefail

              cd /tmp
              BRANCH=exp/sp-fix
              git clone -b "$BRANCH" https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/wan2-i2v-14b.git wan2-i2v-14b
              cd wan2-i2v-14b

              LOCAL_RESULTS=/tmp/results; mkdir -p "$LOCAL_RESULTS"

              # ─── PROVENANCE part 1: which code (no deps needed) ───
              GIT_SHA=$(git rev-parse HEAD)
              GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
              echo "┌────────────── PROVENANCE ──────────────"
              echo "│ branch : $GIT_BRANCH (requested: $BRANCH)"
              echo "│ commit : $GIT_SHA"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└─────────────────────────────────────────"
              { echo "branch=$GIT_BRANCH commit=$GIT_SHA"; } > "$LOCAL_RESULTS/provenance.txt"

              # torch.compile(backend='neuron') writes NEFFs to this cache. Pin it
              # so the per-NEFF capture loop knows exactly where to look.
              export NEURON_COMPILE_CACHE_URL=/var/tmp/neuron-compile-cache
              mkdir -p /var/tmp/neuron-compile-cache /tmp/neff_cache

              REFERENCE_LINE="(none — clean median is the baseline)"

              # ─── deps + model download (no run) ───
              bash scripts/prepare.sh 2>&1 | tee "$LOCAL_RESULTS/prepare.txt" | tail -5 || { echo "PREPARE FAILED"; exit 1; }

              # ─── PROVENANCE part 2: confirm NKI kernel loads on THIS code (needs deps) ───
              NKI_STATUS=$(python3 -c 'import wan.modules.attention as a; print("self="+str(a._NKI_SELF_AVAILABLE), "cross="+str(a._NKI_CROSS_AVAILABLE), "SEQLEN_MULT="+str(a.SELF_ATTN_SEQLEN_MULTIPLE))' 2>&1 | tr '\n' ' ')
              echo "PROVENANCE NKI: $NKI_STATUS"
              echo "nki=$NKI_STATUS" >> "$LOCAL_RESULTS/provenance.txt"

              export WAN_DIR=/tmp/wan2-i2v-14b
              export MODEL_PATH=/tmp/Wan2.2-I2V-A14B
              WORLD_SIZE=$(( ${TP_DEGREE:-4} * ${SP_DEGREE:-2} ))

              # ─── run helper: $1=label $2=NUM_RUNS  (extra env prefixed by caller) ───
              # Workload prints "... total=<N>s" per run via inference_neuron_i2v.py.
              run_wan() {
                local OUT="$1" RUNS="$2"
                NUM_RUNS="$RUNS" torchrun --nproc_per_node="$WORLD_SIZE" --master_port=29500 \
                  /tmp/wan2-i2v-14b/inference_neuron_i2v.py 2>&1 | tee "$OUT"
              }
              # median (in seconds) of all "total=<N>s" lines in a log
              median_total_s() {
                grep -oE "total=[0-9.]+s" "$1" | grep -oE "[0-9.]+" | sort -n | \
                  awk '{a[NR]=$1} END{ if(NR==0){print "N/A"} else if(NR%2){print a[(NR+1)/2]} else {printf "%.1f", (a[NR/2]+a[NR/2+1])/2} }'
              }

              # ─── dominant-NEFF detail via neuron-profile view summary-text ───
              # neuron-profile CLI ONLY. NO neuron-explorer/server/SQL/parquet/curl,
              # NO --output-format json (returns EMPTY on this image).
              neff_hotspots() {
                local NEFF="$1" NTFF="$2" HOTS="$3"
                [ -n "$NEFF" ] && [ -f "$NTFF" ] || { echo "no NEFF/NTFF — skip detail"; return; }
                echo "═══ dominant NEFF detail (summary-text) ═══" | tee "$HOTS"
                timeout 180 neuron-profile view -n "$NEFF" -s "$NTFF" \
                  --output-format summary-text 2>/dev/null | tee -a "$HOTS" || echo "  view failed"
                echo "  (name the hot op from: gpsimd_engine_active_time_percent,"
                echo "   software_dynamic_dma_packet_percent + _count, hardware_dynamic_dma_packet_percent,"
                echo "   dma_transfer_average_bytes, matmul_instruction_count, transpose_flops)"
              }

              # ─── run_explorer: PROVEN method, neuron-profile CLI ONLY ───
              # For EACH cached NEFF: capture --single-io -> view summary-json -> aggregate.
              # Then summary-text on the dominant NEFF.
              run_explorer() {
                local POUT=/tmp/perneff_prof; rm -rf "$POUT"; mkdir -p "$POUT"
                # auto-detect NEFFs from torch.compile cache AND /tmp/neff_cache
                mapfile -t NEFFS < <(find /var/tmp/neuron-compile-cache /tmp/neff_cache -name "*.neff" 2>/dev/null | sort -u)
                echo "NEFFs found: ${#NEFFS[@]}"
                local OK=0
                for neff in "${NEFFS[@]}"; do
                  local hash; hash=$(basename "$neff" .neff)
                  local ntff="$POUT/${hash}.ntff" json="$POUT/${hash}.json"
                  NEURON_RT_ENABLE_DGE_NOTIFICATIONS=1 timeout 180 \
                    neuron-profile capture --single-io -n "$neff" -s "$ntff" >/dev/null 2>&1 || continue
                  [ -f "$ntff" ] || continue
                  timeout 120 neuron-profile view -n "$neff" -s "$ntff" --output-format summary-json > "$json" 2>/dev/null || true
                  [ -s "$json" ] && OK=$((OK+1))
                done
                echo "captured+viewed OK: $OK / ${#NEFFS[@]}"
                python3 scripts/neuron/profile_all_neffs.py "$POUT" 2>&1 | tee "$LOCAL_RESULTS/perneff_breakdown.txt" || echo "aggregation failed"
                local BIGHASH BIGNEFF
                BIGHASH=$(python3 scripts/neuron/pick_neffs.py "$POUT" /var/tmp/neuron-compile-cache | head -1)
                BIGNEFF=$(find /var/tmp/neuron-compile-cache /tmp/neff_cache -name "${BIGHASH}.neff" 2>/dev/null | head -1)
                neff_hotspots "$BIGNEFF" "$POUT/${BIGHASH}.ntff" "$LOCAL_RESULTS/hotspots_${BIGHASH}.txt"

                # ─── PRESERVE heavy NEFF+NTFF pairs for instruction-level (SQL) query ───
                # summary-text can't name the op; the NTFF trace can. Archive the top-5
                # heaviest so /neuron-nki-profile-querying can run a per-op DMA breakdown.
                local PAIRS="$LOCAL_RESULTS/ntff_pairs"; mkdir -p "$PAIRS"
                local kept=0
                while read -r h; do
                  [ -n "$h" ] || continue
                  local nf; nf=$(find /var/tmp/neuron-compile-cache /tmp/neff_cache -name "${h}.neff" 2>/dev/null | head -1)
                  if [ -n "$nf" ] && [ -f "$POUT/${h}.ntff" ]; then
                    cp "$nf" "$PAIRS/${h}.neff" && cp "$POUT/${h}.ntff" "$PAIRS/${h}.ntff" && kept=$((kept+1))
                  fi
                done < <(python3 scripts/neuron/top_neffs.py "$POUT" 5 2>/dev/null)
                echo "preserved $kept heavy NEFF+NTFF pairs in $PAIRS (for SQL/parquet query)"
              }

              echo "════════════ NEURON 3-RUN BENCHMARK (Wan2.2-I2V-A14B) ════════════"
              echo "  reference: $REFERENCE_LINE"
              echo "  TP=${TP_DEGREE} SP=${SP_DEGREE} world=${WORLD_SIZE} frames=${FRAME_NUM} steps=${NUM_STEPS}"
              echo "=================================================================="

              echo "=== [1/3] WARMUP (compile-if-cold / populate NEFF cache; NOT timed) ==="
              run_wan "$LOCAL_RESULTS/warmup.txt" 1 | grep -iE "Compiling|total=|FAILED|Error" || echo "(warmup output captured)"
              echo "NEFFs in cache after warmup: $(find /var/tmp/neuron-compile-cache /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l)"

              echo "=== [2/3] CLEAN RUN (NO profiler) — median total = REAL LATENCY ==="
              run_wan "$LOCAL_RESULTS/clean.txt" 3 | grep -iE "denoise=|vae=|total=|FAILED" || echo "CLEAN RUN FAILED"
              T_CLEAN=$(median_total_s "$LOCAL_RESULTS/clean.txt")

              echo "=== [3/3] PROFILED RUN (NEURON_RT_INSPECT_ENABLE=1 — overhead delta) ==="
              NEURON_RT_INSPECT_ENABLE=1 run_wan "$LOCAL_RESULTS/profiled.txt" 3 | grep -iE "denoise=|vae=|total=|FAILED" || echo "PROFILED RUN FAILED"
              T_PROF=$(median_total_s "$LOCAL_RESULTS/profiled.txt")

              echo "=== [4] per-NEFF engine breakdown + dominant-NEFF metrics (neuron-profile CLI) ==="
              run_explorer

              echo "=== PROFILER-OVERHEAD COMPARISON ==="
              echo "  clean    (no profiler, REAL latency) : ${T_CLEAN:-N/A} s/run"
              echo "  profiled (profiler on)               : ${T_PROF:-N/A} s/run"
              echo "  reference                            : $REFERENCE_LINE"
              echo "  (compare engine SHARES from run 3, not absolute µs)"

              echo "=== [5] INSTRUCTION-LEVEL DMA ANALYSIS (names the op behind each heavy NEFF) ==="
              # Ingest the heavy NEFF+NTFF pairs preserved by run_explorer to parquet
              # (local /tmp) and print a per-NEFF report: engine/DMA shares + the HLO op
              # + source line driving the DMA. Tees into results so it's archived too.
              bash scripts/neuron/run_dma_analysis.sh "$LOCAL_RESULTS/ntff_pairs" \
                2>&1 | tee "$LOCAL_RESULTS/dma_analysis.txt" || echo "DMA analysis skipped"

              # ─── persist results + VIDEO for correctness validation ───
              cp /tmp/wan2_i2v_output.mp4 "$LOCAL_RESULTS/" 2>/dev/null && echo "video archived" || echo "NO VIDEO PRODUCED"
              ARCHIVE=/tmp/wan2-i2v-14b_results.tar.gz
              tar -czf "$ARCHIVE" -C /tmp results 2>/dev/null || true
              cp "$ARCHIVE" /var/mdl/ 2>/dev/null && echo "Saved: /var/mdl/$(basename "$ARCHIVE")" || echo "persist skipped"
              echo "╔══ VALIDATE video. $GIT_BRANCH @ ${GIT_SHA:0:12} SP=${SP_DEGREE} steps=${NUM_STEPS} ══╗"
          resources:
            claims:
              - name: s-lnc1-trn2
            requests:
              cpu: 22
              memory: 220Gi
            limits:
              cpu: 22
              memory: 220Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: TORCH_NEURONX_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_FLAGS
              value: "--model-type=transformer"
            - name: TP_DEGREE
              value: "4"
            - name: SP_DEGREE
              value: "2"
            - name: T5_RANK
              value: "0"
            - name: VAE_TP_DEGREE
              value: "2"
            - name: USE_NKI_KERNELS
              value: "1"
            - name: NUM_STEPS
              value: "10"
            - name: NUM_RUNS
              value: "1"
            - name: FRAME_NUM
              value: "21"
            - name: INSTANCE_TYPE
              value: "trn2.48xlarge"
            - name: LNC_CONFIG
              value: "LNC1"
            - name: NUM_NEURON_DEVICES
              value: "1"
            - name: CUDA_VISIBLE_DEVICES
              value: ""
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
