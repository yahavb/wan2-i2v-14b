apiVersion: batch/v1
kind: Job
metadata:
  name: wan2-i2v-14b
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: wan2-i2v-14b
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn2
      resourceClaims:
        - name: s-lnc1-trn2
          resourceClaimTemplateName: s-lnc1-trn2
      containers:
        - name: inference
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euxo pipefail
              cd /tmp
              git clone -b tp4-sp2 https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/wan2-i2v-14b.git
              cd wan2-i2v-14b
              bash setup.sh
          resources:
            claims:
              - name: s-lnc1-trn2
            requests:
              cpu: 22
              memory: 220Gi
            limits:
              cpu: 22
              memory: 220Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: TORCH_NEURONX_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_FLAGS
              value: "--model-type=transformer"
            - name: TP_DEGREE
              value: "4"
            - name: SP_DEGREE
              value: "2"
            - name: T5_RANK
              value: "0"
            - name: VAE_TP_DEGREE
              value: "2"
            - name: USE_NKI_KERNELS
              value: "1"
            - name: NUM_STEPS
              value: "10"
            - name: NUM_RUNS
              value: "1"
            - name: FRAME_NUM
              value: "21"
            - name: INSTANCE_TYPE
              value: "trn2.48xlarge"
            - name: LNC_CONFIG
              value: "LNC1"
            - name: NUM_NEURON_DEVICES
              value: "1"
            - name: CUDA_VISIBLE_DEVICES
              value: ""
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
