# One template for all 16 trn2 chips: 2 chips in one column of the 4x4 topology grid,
# rows 0-1 if a column has them free, else rows 2-3 (DRA firstAvailable).
# Replaces m-lnc2 (rows 0-1 only) + m-lnc2-b (rows 2-3 only) once tested.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: m-lnc2-any
  namespace: default
spec:
  spec:
    devices:
      config:
      - opaque:
          driver: neuron.aws.com
          parameters:
            apiVersion: neuron.aws.com/v1
            kind: NeuronConfig
            logicalNeuronCore: 2
        requests:
        - neurons
      constraints:
      - matchAttribute: neuron.aws.com/topology_x
        requests:
        - neurons
      requests:
      - name: neurons
        firstAvailable:
        - name: top
          allocationMode: ExactCount
          count: 2
          deviceClassName: neuron.aws.com
          selectors:
          - cel:
              expression: device.attributes['neuron.aws.com'].instanceType in ['trn2.48xlarge',
                'trn3-dev1.48xlarge'] && (device.attributes['neuron.aws.com'].topology_y
                == 0 || device.attributes['neuron.aws.com'].topology_y == 1)
        - name: bottom
          allocationMode: ExactCount
          count: 2
          deviceClassName: neuron.aws.com
          selectors:
          - cel:
              expression: device.attributes['neuron.aws.com'].instanceType in ['trn2.48xlarge',
                'trn3-dev1.48xlarge'] && (device.attributes['neuron.aws.com'].topology_y
                == 2 || device.attributes['neuron.aws.com'].topology_y == 3)
