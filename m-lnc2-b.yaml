# Same as m-lnc2, but for rows 2 and 3 of the trn2 4x4 Neuron topology grid.
# m-lnc2 selects topology_y 0 or 1, so only 8 of 16 chips are ever eligible.
# Together the two templates cover all 16: each claim is 2 chips in one column.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: m-lnc2-b
  namespace: default
spec:
  spec:
    devices:
      config:
      - opaque:
          driver: neuron.aws.com
          parameters:
            apiVersion: neuron.aws.com/v1
            kind: NeuronConfig
            logicalNeuronCore: 2
        requests:
        - neurons
      constraints:
      - matchAttribute: neuron.aws.com/topology_x
        requests:
        - neurons
      requests:
      - exactly:
          allocationMode: ExactCount
          count: 2
          deviceClassName: neuron.aws.com
          selectors:
          - cel:
              expression: device.attributes['neuron.aws.com'].instanceType in ['trn2.48xlarge',
                'trn3-dev1.48xlarge'] && (device.attributes['neuron.aws.com'].topology_y
                == 2 || device.attributes['neuron.aws.com'].topology_y == 3)
        name: neurons
