apiVersion: v1
kind: Service
metadata:
  name: wan2-i2v-14b-gradio
  namespace: default
spec:
  type: NodePort
  selector:
    app: wan2-i2v-14b-gradio
  ports:
    - port: 7860
      targetPort: 7860
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wan2-i2v-14b-gradio
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wan2-i2v-14b-gradio
  template:
    metadata:
      labels:
        app: wan2-i2v-14b-gradio
    spec:
      nodeSelector:
        node-type: m5
      containers:
        - name: app
          image: public.ecr.aws/docker/library/python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              set -e
              DEBIAN_FRONTEND=noninteractive apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git >/dev/null
              git clone -b "$BRANCH" https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/wan2-i2v-14b.git /app
              pip install -q --root-user-action=ignore --disable-pip-version-check gradio requests
              exec python -u /app/gradio_app.py
          env:
            - name: BRANCH
              value: "main"
            - name: WAN_URL
              value: "http://wan2-i2v-14b.default.svc.cluster.local:8000"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
          ports:
            - containerPort: 7860
          startupProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 7860
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7860
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
